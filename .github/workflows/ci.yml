name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        env:
          USE_SQLITE: "true"
        run: python manage.py check

      - name: Check migrations
        env:
          USE_SQLITE: "true"
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        env:
          USE_SQLITE: "true"
        run: python manage.py test store

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test deployment URL helpers
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build sub-directory frontend
        env:
          VITE_BASE_PATH: /demos/django-react-ecommerce/
          VITE_DJANGO_BASE_URL: /demos/django-react-ecommerce
        run: npm run build

  images:
    name: Build demo images (publish on main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${TARGET}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy ecommerce to EC2
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: ecommerce-production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""
      INSTANCE_ID: i-019b5c487c103508a
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::451195512799:role/github-deploy-ecommerce
          aws-region: eu-north-1
          role-session-name: ecommerce-${{ github.run_id }}
      - name: Deploy the tested images and wait for completion
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          command_id=$(aws ssm send-command \
            --document-name Vanitatech-DeployEcommerce \
            --document-version '1' \
            --instance-ids "$INSTANCE_ID" \
            --parameters "CommitSha=$COMMIT_SHA" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text --no-cli-pager)
          echo "Systems Manager command: $command_id"
          bash deploy/wait-for-command.sh "$command_id" "$INSTANCE_ID"
